<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Swarm</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <!-- Modern functional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header>
            <div class="brand">
                <h1>SWARM_MVP</h1>
                <span class="badge">v0.1</span>
            </div>
            <div class="status-indicator">
                <div id="ws-light" class="indicator-light disconnected"></div>
                <span id="ws-status">Disconnected</span>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main>
            <!-- System Telemetry Panel -->
            <section class="panel">
                <h2>System Telemetry</h2>
                <div class="data-grid" id="telemetry-grid">
                    <div class="data-cell">
                        <span class="label">Nodes</span>
                        <span class="value" id="val-nodes">--</span>
                    </div>
                    <div class="data-cell">
                        <span class="label">Bridges</span>
                        <span class="value" id="val-bridges">--</span>
                    </div>
                    <div class="data-cell">
                        <span class="label">Engine State</span>
                        <span class="value" id="val-state">--</span>
                    </div>
                </div>
            </section>

            <!-- Network Canvas Area (For future D3/Canvas map) -->
            <section class="panel map-panel">
                <div class="panel-header">
                    <h2>Manifold Map</h2>
                    <button id="btn-reconnect" class="action-btn">Force Sync</button>
                </div>
                <div id="manifold-canvas" class="canvas-container">
                    <div class="canvas-placeholder">Waiting for telemetry...</div>
                </div>
            </section>
            
            <!-- Event Log -->
            <section class="panel log-panel">
                <h2>Event Stream</h2>
                <div id="event-log" class="terminal-log">
                    <!-- Logs injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA capabilities
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
